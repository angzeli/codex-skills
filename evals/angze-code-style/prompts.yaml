schema_version: 1
skill: angze-code-style

positive_implicit:
  - id: positive-python-docstrings
    language: python
    mode: document-existing
    prompt: "Add concise docstrings to the non-trivial functions and document the units and NumPy array shapes without changing calculations."
  - id: positive-python-cramped
    language: python
    mode: readability-refactor
    prompt: "Make this dense spectroscopy routine easier to scan, preserving evaluation order and numerical results."
  - id: positive-typescript-jsdoc
    language: typescript
    mode: document-existing
    prompt: "Improve the documentation of this data transformation and clarify the runtime assumptions without duplicating its TypeScript types."
  - id: positive-javascript-comments
    language: javascript
    mode: comment-cleanup
    prompt: "Replace the repetitive AI-like comments with concise explanations of the non-obvious browser and data-ordering constraints."
  - id: positive-html-structure
    language: html-css
    mode: readability-refactor
    prompt: "Clarify this scientific report page's semantic structure and accessibility while avoiding comments on every element."
  - id: positive-html-dashboard-contracts
    language: html
    mode: document-existing
    prompt: "Make dashboard.html easier to maintain and document the non-obvious DOM, ordering, scaling, and CSV contracts without changing browser behaviour."
  - id: positive-html-script-readability
    language: html
    mode: readability-refactor
    prompt: "Untangle the inline JavaScript in dashboard.html and add only useful comments, preserving IDs, visible values, and exported data bytes."
  - id: positive-css-layout
    language: css
    mode: document-existing
    prompt: "Document only the unusual print-layout constraints and rename opaque new classes where that is safe."
  - id: positive-shell-workflow
    language: shell
    mode: readability-refactor
    prompt: "Make this computational workflow readable and document its required executables, paths, environment variables, and stages."
  - id: positive-shell-aggregate-errors
    language: shell
    mode: document-existing
    prompt: "Clarify workflow.sh so maintainers understand its aggregate-error handling, cleanup trap, and manifest contract without changing exit behaviour."
  - id: positive-shell-scientific-parameters
    language: shell
    mode: readability-refactor
    prompt: "Reorganize the dense Bash stages in workflow.sh and explain the configured computational parameters without assigning unsupported scientific meaning."
  - id: positive-latex-macros
    language: latex
    mode: document-existing
    prompt: "Organize these macros and explain the non-obvious journal-template workaround without rewriting ordinary LaTeX commands."
  - id: positive-latex-report-structure
    language: latex
    mode: readability-refactor
    prompt: "Improve the source readability of report.tex while preserving its labels, references, scientific values, float order, and rendered content."
  - id: positive-latex-conditional
    language: latex
    mode: document-existing
    prompt: "Document the conditional appendix and table-order contracts in report.tex, keeping the template class, macro values, and spacing workaround intact."
  - id: positive-config-conventions
    language: yaml
    mode: documentation-review
    prompt: "Review whether this pipeline configuration adequately explains units, axis order, and normalization conventions; do not change its schema."
  - id: positive-mixed-repository
    language: mixed
    mode: limited-edit
    prompt: "Apply focused documentation and readability improvements across the Python analysis and shell entry point, preserving APIs, files, and numerical outputs."
  - id: positive-notebook-contracts
    language: jupyter
    mode: document-existing
    prompt: "Document this scientific notebook's evidence-backed units, shapes, ordering, missing-value conventions, and stored-output state without executing it."
  - id: positive-notebook-markdown-comments
    language: jupyter
    mode: comment-cleanup
    prompt: "Improve the existing notebook Markdown and code comments, keeping cell structure, metadata, outputs, execution counts, and unrelated serialization unchanged."
  - id: positive-notebook-cell-io
    language: jupyter
    mode: document-existing
    prompt: "Clarify the inputs and outputs of the non-trivial cells and record which results are stored rather than recomputed."
  - id: positive-data-contracts
    language: mixed
    mode: document-existing
    prompt: "Document the table schema, row ordering, missing-value sentinel, array shape, and filesystem output contract without inventing scientific meaning."
  - id: positive-comment-pruning
    language: mixed
    mode: comment-cleanup
    prompt: "Prune the comments that narrate syntax or duplicate nearby documentation, retaining only evidence-backed constraints and interpretation."
  - id: positive-notebook-readability
    language: jupyter
    mode: limited-edit
    prompt: "Make this source notebook easier to follow through focused Markdown and comment edits while preserving its calculations, cells, execution state, and stored outputs."

negative:
  - id: negative-debug
    language: python
    prompt: "Find and fix the off-by-one error in this loop."
  - id: negative-dependency
    language: mixed
    prompt: "Upgrade the project to the latest supported dependency versions."
  - id: negative-tests
    language: python
    prompt: "Run the existing unit tests and report the failures."
  - id: negative-feature
    language: typescript
    prompt: "Add OAuth login to this web application."
  - id: negative-ci
    language: yaml
    prompt: "Repair the failing GitHub Actions workflow."
  - id: negative-performance
    language: python
    prompt: "Profile this matrix multiplication and make it faster."
  - id: negative-security
    language: javascript
    prompt: "Audit this endpoint for injection vulnerabilities."
  - id: negative-data-analysis
    language: python
    prompt: "Fit a nonlinear model to these measurements and report confidence intervals."
  - id: negative-tex-compile
    language: latex
    prompt: "Compile this manuscript and fix the missing package error."
  - id: negative-latex-reference
    language: latex
    prompt: "Add a bibliography entry to report.tex and cite it in the discussion."
  - id: negative-deploy
    language: shell
    prompt: "Deploy the application to the staging cluster."
  - id: negative-shell-execute
    language: shell
    prompt: "Run workflow.sh with the sample input and report its exit code and generated files."
  - id: negative-html-feature
    language: html
    prompt: "Add a dark-mode toggle to dashboard.html and persist the selection in local storage."
  - id: negative-html-debug
    language: html
    prompt: "Fix the dashboard filter so selecting a sample updates the visible row count."
  - id: negative-notebook-execute
    language: jupyter
    prompt: "Run every cell in this notebook and save fresh outputs."
  - id: negative-notebook-crash
    language: jupyter
    prompt: "Find why cell 12 crashes and fix the exception."
  - id: negative-notebook-analysis
    language: jupyter
    prompt: "Analyze these measurements in the notebook and report the most significant trend."
  - id: negative-notebook-methodology
    language: jupyter
    prompt: "Optimize the fitting methodology in this notebook to reduce the residual error."
  - id: negative-notebook-plot
    language: jupyter
    prompt: "Add a publication-ready plot of the calculated spectrum to this notebook."
  - id: negative-notebook-regenerate
    language: jupyter
    prompt: "Clear all outputs, restart the kernel, and regenerate the notebook from top to bottom."
  - id: negative-notebook-debug
    language: jupyter
    prompt: "Debug the wrong numerical result in the final notebook cell."
  - id: negative-notebook-feature
    language: jupyter
    prompt: "Add an interactive molecule viewer and export button to the notebook."

boundary:
  - id: boundary-shell-review-only
    language: shell
    expected: trigger-review-only
    prompt: "Review workflow.sh for misleading parameter and error-handling comments. Do not modify or execute it; report only evidence-supported findings."
  - id: boundary-shell-generated
    language: shell
    expected: trigger-and-skip-generated
    prompt: "Assess the comments in generated_workflow.sh, but do not edit the generated file; identify the upstream change that would be needed."
  - id: boundary-latex-review-only
    language: latex
    expected: trigger-review-only
    prompt: "Review report.tex for unsupported descriptions of configured values. Do not edit the source or redesign the template."
  - id: boundary-latex-generated
    language: latex
    expected: trigger-and-skip-generated
    prompt: "Review generated_supplement.tex for documentation clarity without modifying it; direct any suggested wording to its generator."
  - id: boundary-html-review-only
    language: html
    expected: trigger-review-only
    prompt: "Review dashboard.html for stale accessibility and export-contract comments. Do not change any files."
  - id: boundary-html-generated
    language: html
    expected: trigger-and-skip-generated
    prompt: "Inspect generated_dashboard.html for misleading documentation, but leave it byte-identical and recommend changes only at the generator."
  - id: boundary-buggy-comment
    language: python
    expected: trigger-review-only
    prompt: "A comment disagrees with the equation below it. Determine which is stale, but do not change the calculation."
  - id: boundary-types-only
    language: typescript
    expected: do-not-trigger
    prompt: "Add missing TypeScript types to the public API."
  - id: boundary-generated-docs
    language: mixed
    expected: trigger-and-skip-generated
    prompt: "Improve comments in the source modules; the generated API client must remain untouched."
  - id: boundary-readme-only
    language: markdown
    expected: do-not-trigger
    prompt: "Rewrite the user-facing installation README for clarity."
  - id: boundary-public-rename
    language: python
    expected: trigger-and-report-risk
    prompt: "Review the scientific names and comments, but preserve all public symbols even if a better name exists."
  - id: boundary-json-comments
    language: json
    expected: trigger-and-use-nearby-doc
    prompt: "Explain the units in this JSON configuration without making the JSON invalid."
  - id: boundary-notebook-cleanup-ambiguous
    language: jupyter
    expected: trigger-and-classify-before-editing
    prompt: "Clean up this notebook."
  - id: boundary-notebook-review-only
    language: jupyter
    expected: trigger-review-only
    prompt: "Review the notebook for stale scientific claims and missing data contracts. Do not modify or execute it."
  - id: boundary-notebook-generated
    language: jupyter
    expected: trigger-and-skip-generated
    prompt: "Improve the comments in this generated pipeline notebook, but leave the generated artifact byte-identical and identify the upstream edit target."
  - id: boundary-notebook-analysis-artifact
    language: jupyter
    expected: trigger-and-report-risk
    prompt: "Assess whether this executed analysis notebook can safely receive documentation edits while preserving every stored output and execution count."
  - id: boundary-notebook-unknown-role
    language: jupyter
    expected: trigger-and-report-risk
    prompt: "Document this notebook, but its source/generated status and execution provenance are unknown."
  - id: boundary-notebook-questionable-claim
    language: jupyter
    expected: trigger-review-only
    prompt: "A Markdown cell assigns units to an unexplained scale factor. Determine whether the claim is supported, but do not change the notebook."

explicit_invocation:
  - id: explicit-review-only
    language: mixed
    mode: review-only
    prompt: "$angze-code-style\nReview this file for readability and documentation quality. Do not modify it. Identify the five highest-value improvements."
  - id: explicit-limited-edit
    language: mixed
    mode: limited-edit
    prompt: "$angze-code-style\nApply only high-confidence documentation and readability improvements to this file. Preserve calculations, public interfaces, file formats, and numerical behaviour."
  - id: explicit-new-function
    language: python
    mode: write-new-code
    prompt: "$angze-code-style\nImplement the requested function using this repository's conventions. Document its units, array shapes, assumptions, failure modes, and return values without over-commenting it."
  - id: explicit-shell-review
    language: shell
    mode: review-only
    prompt: "$angze-code-style\nReview this workflow for comment quality and unstated path assumptions. Do not edit or run it."
  - id: explicit-html-limited
    language: html-css
    mode: limited-edit
    prompt: "$angze-code-style\nImprove only semantic structure, accessibility documentation, and opaque names in this report component; leave generated CSS untouched."
  - id: explicit-latex-review
    language: latex
    mode: review-only
    prompt: "$angze-code-style\nReview report.tex for source readability, label and macro contracts, and unsupported scientific interpretation. Do not modify it."
  - id: explicit-notebook-review
    language: jupyter
    mode: review-only
    prompt: "$angze-code-style\nReview this notebook's role, scientific and data contracts, execution state, outputs, and documentation risks. Do not modify or execute it."
  - id: explicit-notebook-limited
    language: jupyter
    mode: limited-edit
    prompt: "$angze-code-style\nApply only evidence-backed Markdown, comment, and docstring improvements to the explicitly allowlisted cells. Preserve all other notebook bytes and do not execute it."
